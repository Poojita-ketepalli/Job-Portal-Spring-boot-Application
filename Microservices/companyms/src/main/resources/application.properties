spring.application.name=company-service

server.port=8081

#H2 Database

#spring.h2.console.enabled=true
#spring.datasource.url=jdbc:h2:mem:test
#spring.jpa.show-sql=true
#spring.jpa.hibernate.ddl-auto=update

#PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5433/company
spring.datasource.username=poojita
spring.datasource.password=poojita
spring.jpa.database=postgresql
#spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create-drop

#properties for clients of feign
job-service.url=http://localhost:8082
company-service.url=http://localhost:8081
review-service.url=http://localhost:8083

#Eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

#Zipkin
management.tracing.sampling.probability = 1.0 #trace each and every request. can be 0 to 1

# Force logging layout to print traceId and spanId
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}] %m%n

# (Optional but safe) Explicitly define your Zipkin upload destination
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans

#Config Server
#spring.config.import=configserver:http://localhost:8084

#RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest